name: Publish konman to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org
    permissions:
      contents: read      # required for actions/checkout and other read operations
      id-token: write     # keep if using OIDC (optional for classic token)
      packages: write
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Workspace
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Compilers and Builders
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Compile Package Distribution Bundles
      run: python -m build

    - name: Publish Package to PyPI Live Index
      uses: pypa/gh-action-pypi-publish@v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
