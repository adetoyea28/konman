name: Publish konman to PyPI

on:
  push:
    tags:
      - 'v*' # Triggers the workflow whenever you push a version tag like v1.0.1, v1.1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org
    permissions:
      id-token: write # MANDATORY for Trusted Publishing OIDC handshake

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Workspace
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Compilers and Builders
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Compile Package Distribution Bundles
      run: python -m build

    - name: Publish Package to PyPI Live Index
      uses: pypa/gh-action-pypi-publish@release/v1