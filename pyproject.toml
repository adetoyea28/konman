[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "konman"
version = "1.0.0"
authors = [
    { name = "Adetoye Ayomide", email = "adetoyea28@gmail.com" }
]
description = "konman: An automated, first-principles, LLM-agnostic codebase context engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.17.0"
]

[project.urls]
Homepage = "https://github.com/adetoyea28/konman.git"
Issues = "https://github.com/adetoyea28/konman.git/issues"

[project.scripts]
konman = "konman.cli:main"
