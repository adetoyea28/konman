[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "konman"
version = "1.1.5"
authors = [
    { name = "Adetoye Ayomide", email = "adetoyea28@gmail.com" }
]
description = "konman: An automated, first-principles, LLM-agnostic codebase context engine."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.17.0",
    "keyring>=25.0.0"
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
gui = ["streamlit>=1.50,<2", "streamlit-flow-component==1.6.1"]

[project.urls]
Homepage = "https://github.com/adetoyea28/konman.git"
Issues = "https://github.com/adetoyea28/konman.git/issues"

[project.scripts]
konman = "konman.cli:main"
